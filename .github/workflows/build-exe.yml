name: Build and Release Python EXE

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile Script to EXE with Assets
      run: |
        pyinstaller --onefile --noconsole --add-data "assets;assets" --add-data "config.json;." main.py
        # --add-data format for Windows: "source_folder_or_file;destination_folder_in_exe"
        # "assets;assets" bundles the folder 'assets' into an internal 'assets' directory.
        # "config.json;." bundles 'config.json' into the root directory of the executable.

    - name: Generate Release Body
      id: release_notes
      run: |
        echo "RELEASE_TAG=${{ github.ref_name }}" >> $env:GITHUB_ENV
        # Creates a fallback tag name if manually triggered without a tag
        if ("${{ github.ref_name }}" -notlike "v*") {
          echo "RELEASE_TAG=v-manual-${{ github.run_number }}" >> $env:GITHUB_ENV
        }

    - name: Create GitHub Release and Upload EXE
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: Release ${{ env.RELEASE_TAG }}
        body: |
          Automated build for release ${{ env.RELEASE_TAG }}.
          
          ### Assets Included
          * See attached `main.exe` below.
        draft: false
        prerelease: false
        files: dist/main.exe # Automatically uploads your exe to the release assets
