name: Build Python EXE

on:
  push:
    branches: [ "main" ] # Triggers whenever you push code to main
  workflow_dispatch:      # Allows manually triggering the build from GitHub UI

jobs:
  build:
    runs-on: windows-latest # Required to build a Windows .exe target

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Change to your preferred Python version
        cache: 'pip'           # Caches dependencies to speed up future runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If your script has a requirements.txt, uncomment the line below:
        # pip install -r requirements.txt

    - name: Compile Script to EXE
      run: |
        pyinstaller --onefile --noconsole main.py
        # Options breakdown:
        # --onefile: Packages everything into a single .exe file
        # --noconsole: Hides the command prompt window (ideal for GUI apps)
        # Change 'main.py' to your script's filename

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-executable
        path: dist/main.exe # PyInstaller outputs the final binary to the 'dist' folder
